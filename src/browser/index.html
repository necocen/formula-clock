<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111311" />
    <meta
      name="description"
      content="A clock that displays a different mathematical expression every second."
    />
    <meta name="formula-clock-build" content="r6-minimal" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Formula Clock" />
    <meta
      property="og:description"
      content="A clock that displays a different mathematical expression every second."
    />
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Formula Clock" />
    <meta name="twitter:image" content="/og-default.png" />
    <title>Formula Clock</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111311'/%3E%3Ccircle cx='10' cy='10' r='4' fill='%23eea28c'/%3E%3Ccircle cx='22' cy='10' r='4' fill='%23e4c782'/%3E%3Ccircle cx='10' cy='22' r='4' fill='%239acbbb'/%3E%3Ccircle cx='22' cy='22' r='4' fill='%23b8ace1'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>FORMULA
          CLOCK
        </div>
        <div class="tools">
          <button
            class="tool icon-only"
            id="settings-open"
            data-i18n-aria-label="settings"
            aria-label="設定"
            aria-haspopup="dialog"
            aria-controls="settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h9m4 0h3M4 17h3m4 0h9" />
              <circle cx="15" cy="7" r="2" />
              <circle cx="9" cy="17" r="2" />
            </svg>
          </button>
          <button
            class="tool icon-only"
            id="sound"
            data-i18n-aria-label="soundOff"
            aria-pressed="false"
            aria-label="時報をオンにする"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4Z" />
              <path id="sound-waves" d="m16 9 6 6m0-6-6 6" />
            </svg>
          </button>
          <button
            class="tool icon-only"
            id="fullscreen"
            data-i18n-aria-label="fullscreen"
            hidden
            aria-pressed="false"
            aria-label="全画面表示"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5" />
            </svg>
          </button>
          <button
            class="tool icon-only"
            id="share"
            data-i18n-aria-label="share"
            data-i18n-title="share"
            disabled
            aria-label="現在の表示を共有"
            title="現在の表示を共有"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 16V3m-4 4 4-4 4 4M7 11H4v10h16V11h-3" />
            </svg>
          </button>
        </div>
      </header>
      <main>
        <h1 class="a11y">Formula Clock</h1>
        <div class="clock-top">
          <div class="source-time" id="source-time" hidden role="img">
            <svg class="source-clock" viewBox="0 0 4200 1100" aria-hidden="true">
              <g class="source-digit" data-digit="0"></g>
              <g class="source-digit" data-digit="1"></g>
              <g class="colon"></g>
              <g class="source-digit" data-digit="2"></g>
              <g class="source-digit" data-digit="3"></g>
              <g class="colon"></g>
              <g class="src-second" id="source-second">
                <g class="source-digit" data-second="0"></g>
                <g class="source-digit" data-second="1"></g>
              </g>
            </svg>
          </div>
        </div>
        <div class="stage-wrap">
          <div class="stage" id="stage" role="img" aria-label="Formula Clock">
            <svg
              id="math-scene"
              class="math-scene"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <g id="notation-root"></g>
              <g id="operator-root"></g>
              <g id="equal-sign"></g>
              <g class="digit" data-digit="0"></g>
              <g class="digit" data-digit="1"></g>
              <g class="digit" data-digit="2"></g>
              <g class="digit" data-digit="3"></g>
              <g class="answer-digit" data-second="0"></g>
              <g class="answer-digit" data-second="1"></g>
            </svg>
            <div id="plain-time" class="plain-time" aria-hidden="true">
              <span>0</span><span>0</span><span>:</span><span>0</span><span>0</span><span>:</span
              ><span>0</span><span>0</span>
            </div>
          </div>
        </div>
        <div class="minute">
          <div
            class="ruler"
            id="ruler"
            data-i18n-aria-label="chooseSecond"
            aria-label="秒を選んでプレビュー"
          ></div>
          <div class="ruler-labels" aria-hidden="true">
            <span>00</span><span>15</span><span>30</span><span>45</span><span>59</span>
          </div>
        </div>
        <div class="transport" id="transport" hidden>
          <span class="seek-hint" data-i18n="seekHint">← → 1秒ずつ移動</span
          ><button
            class="live-return"
            id="go-live"
            data-i18n-title="goLiveShortcut"
            title="現在時刻に戻る（L）"
          >
            <span data-i18n="goLive">現在時刻へ</span>
          </button>
        </div>
      </main>
    </div>
    <p id="share-status" class="share-status" role="status" aria-live="polite"></p>
    <dialog class="settings-dialog share-dialog" id="share-dialog" aria-labelledby="share-title">
      <div class="settings-header">
        <h2 id="share-title"><span data-i18n="shareTitle">Share</span></h2>
        <button
          class="settings-close"
          id="share-close"
          data-i18n-aria-label="close"
          aria-label="閉じる"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <p><span data-i18n="shareHelp">このURLをコピーして共有できます。</span></p>
      <input
        id="share-url"
        data-i18n-aria-label="shareUrl"
        class="share-url"
        type="url"
        readonly
        aria-label="共有URL"
      />
      <div class="share-actions">
        <button id="share-native" class="small-button" data-i18n="shareNative" hidden>
          共有する</button
        ><button id="share-copy" class="small-button" data-i18n="shareCopy">リンクをコピー</button>
      </div>
    </dialog>
    <dialog class="settings-dialog" id="settings" aria-labelledby="settings-title">
      <div class="settings-header">
        <h2 id="settings-title"><span data-i18n="settings">設定</span></h2>
        <button
          class="settings-close"
          id="settings-close"
          data-i18n-aria-label="closeSettings"
          aria-label="設定を閉じる"
          autofocus
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <label class="setting-row"
        ><span data-i18n="font">フォント</span
        ><select id="font-choice" data-i18n-aria-label="mathFont" aria-label="数式のフォント">
          <option value="stix2" selected>STIX Two</option>
          <option value="termes">Termes</option>
          <option value="fira">Fira</option>
          <option value="euler">Euler</option>
        </select></label
      >
      <div class="setting-row">
        <span id="numeral-label" data-i18n="numerals">数字のスタイル</span>
        <div
          class="segmented-control"
          id="numeral-choice"
          role="radiogroup"
          aria-labelledby="numeral-label"
        >
          <label><input type="radio" name="numerals" value="lining" /><span>Lining</span></label
          ><label
            ><input type="radio" name="numerals" value="oldstyle" checked /><span
              >Oldstyle</span
            ></label
          >
        </div>
      </div>
      <div class="setting-row">
        <span id="division-label" data-i18n="division">除算のスタイル</span>
        <div
          class="segmented-control"
          id="division-choice"
          role="radiogroup"
          aria-labelledby="division-label"
        >
          <label
            ><input type="radio" name="division" value="fraction" checked /><span
              data-i18n="fraction"
              >分数</span
            ></label
          ><label><input type="radio" name="division" value="inline" /><span>÷</span></label
          ><label><input type="radio" name="division" value="slash" /><span>/</span></label>
        </div>
      </div>
      <label class="setting-row"
        ><span data-i18n="volume">音量</span
        ><input
          id="volume"
          data-i18n-aria-label="signalVolume"
          type="range"
          min="0"
          max="100"
          value="25"
          aria-label="時報の音量"
      /></label>
      <label class="custom-time-label" for="custom-time"
        ><span data-i18n="setTime">時刻を指定</span></label
      >
      <div class="custom-time">
        <input type="time" id="custom-time" step="1" value="12:34:30" /><button
          class="small-button"
          id="custom-go"
        >
          <span data-i18n="show">表示</span>
        </button>
      </div>
      <details class="advanced" id="advanced-settings">
        <summary><span data-i18n="advanced">詳細</span></summary>
        <label class="setting-row experimental-option"
          ><span data-i18n="symbolMotion">記号をなめらかに動かす</span
          ><input id="symbol-motion" type="checkbox"
        /></label>
        <label class="setting-row experimental-option"
          ><span data-i18n="structureMotion">分数・√・括弧も動かす</span
          ><input id="structure-motion" type="checkbox"
        /></label>
        <label class="setting-row experimental-option"
          ><span data-i18n="symbolMorph">四則記号を変形する</span
          ><input id="symbol-morph" type="checkbox"
        /></label>
        <p id="render-status" role="status" hidden></p>
        <p id="state-label" role="status"></p>
        <p>
          <span data-i18n="shortcuts"
            >← → 一時停止中に1秒移動 / Space 一時停止・現在時刻へ / L 現在時刻へ / M 時報 / F
            全画面</span
          >
        </p>
      </details>
      <div class="settings-links">
        <button
          class="license-link"
          id="licenses-open"
          aria-haspopup="dialog"
          aria-controls="licenses"
        >
          <span data-i18n="licenses">LICENSE</span></button
        ><a href="https://github.com/necocen/formula-clock" target="_blank" rel="noopener"
          >GitHub ↗</a
        >
      </div>
    </dialog>
    <dialog class="settings-dialog license-dialog" id="licenses" aria-labelledby="licenses-title">
      <div class="settings-header">
        <h2 id="licenses-title"><span data-i18n="licenses">LICENSE</span></h2>
        <button
          class="settings-close"
          id="licenses-close"
          data-i18n-aria-label="closeLicenses"
          aria-label="ライセンスを閉じる"
          autofocus
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <!-- clock-licenses -->
    </dialog>
    <noscript
      ><p style="padding: 30px; text-align: center">
        JavaScript is required to display this clock. / この時計の表示にはJavaScriptが必要。
      </p></noscript
    >
    <script type="module" src="./main.ts"></script>
  </body>
</html>
