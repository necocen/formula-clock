<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111311">
<meta name="description" content="時刻の4桁が、秒を表す数式に変わる。数字の同一性を保って変形する、小さな計算時計。">
<meta name="formula-clock-build" content="r6-minimal">
<title>Formula Clock</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111311'/%3E%3Ccircle cx='10' cy='10' r='4' fill='%23eea28c'/%3E%3Ccircle cx='22' cy='10' r='4' fill='%23e4c782'/%3E%3Ccircle cx='10' cy='22' r='4' fill='%239acbbb'/%3E%3Ccircle cx='22' cy='22' r='4' fill='%23b8ace1'/%3E%3C/svg%3E">
<style>

:root{color-scheme:dark;--bg:#111311;--fg:#edece4;--muted:#92978e;--dim:#636b61;--line:#30362c;--c0:#eea28c;--c1:#e4c782;--c2:#9acbbb;--c3:#b8ace1;--sans:Inter,"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 48% 38%,#2b332323,transparent 64%)}button,input,select{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--c2);outline-offset:4px}button:disabled{cursor:default;opacity:.35}button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}button[aria-pressed=true]{border-color:#687762;background:#283125}button:hover:not(:disabled){background:#252c22;color:#fff}::selection{background:#83977b55}
.shell{position:relative;max-width:1520px;min-height:100svh;margin:auto;padding:28px 50px;display:flex;flex-direction:column}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:40px}.brand{display:flex;align-items:center;gap:11px;font-size:12px;font-weight:550;letter-spacing:2.3px;white-space:nowrap}.brand-mark{display:grid;grid-template-columns:repeat(2,3px);gap:4px}.brand-mark i{width:3px;height:3px;border-radius:50%;background:var(--c0)}.brand-mark i:nth-child(2){background:var(--c1)}.brand-mark i:nth-child(3){background:var(--c2)}.brand-mark i:nth-child(4){background:var(--c3)}.tools{display:flex;gap:8px}.tool{display:inline-flex;justify-content:center;gap:8px;align-items:center;border:1px solid var(--line);background:transparent;border-radius:7px;padding:11px 12px;font-size:11px;line-height:1;min-height:40px;transition:background .2s,border-color .2s}.tool.icon-only{width:40px;padding:10px}.tool[aria-pressed=true]{color:var(--c2)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;padding:56px 0 64px}.clock-top{display:flex;justify-content:center;margin-bottom:8px}.source-time{display:flex;align-items:baseline;gap:3px;font-family:var(--mono);font-size:24px;letter-spacing:2px}.source-time span[data-digit="0"]{color:var(--c0)}.source-time span[data-digit="1"]{color:var(--c1)}.source-time span[data-digit="2"]{color:var(--c2)}.source-time span[data-digit="3"]{color:var(--c3)}.source-time .colon{margin:0 4px;color:#71786c;font-size:20px}.source-time .src-second{color:var(--muted);font-size:inherit}.source-time[hidden]{display:flex;visibility:hidden}
.stage-wrap{position:relative;margin:8px 0 0}.stage{height:242px;width:100%;position:relative;overflow:visible;isolation:isolate}.stage:before{content:"";position:absolute;left:12%;right:12%;top:17%;bottom:10%;border-radius:50%;background:radial-gradient(ellipse,#8aa7770c,transparent 68%);pointer-events:none}.math-scene{position:absolute;inset:0;width:100%;height:100%;overflow:visible;visibility:hidden;user-select:none}.math-scene .digit,.answer-digit{fill:currentColor;stroke:currentColor;stroke-width:0;transition:opacity 440ms ease,filter 440ms ease}.digit[data-digit="0"]{color:var(--c0)}.digit[data-digit="1"]{color:var(--c1)}.digit[data-digit="2"]{color:var(--c2)}.digit[data-digit="3"]{color:var(--c3)}.answer-digit{color:var(--fg)}#operator-root{fill:currentColor;stroke:currentColor;stroke-width:0;color:#c3c8ba}#equal-sign{fill:currentColor;stroke:currentColor;stroke-width:0;color:#c3c8ba;opacity:0;transition:opacity 440ms ease}#notation-root{color:#c3c8ba;transition:opacity 440ms ease}.stage.resting .digit{opacity:.48;filter:saturate(.38)}.stage.resting .answer-digit{opacity:.48}.stage.resting #notation-root{opacity:.44}.stage.loading .digit{opacity:.6}.math-staging{position:fixed;left:-100000px;top:0;visibility:hidden;pointer-events:none;width:20000px;font-size:16px;contain:layout style;z-index:-1}.math-staging mjx-container{margin:0!important}.plain-time{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;font-family:var(--mono);font-size:clamp(28px,6vw,78px);letter-spacing:1px;opacity:.48;filter:saturate(.38);white-space:nowrap}.plain-time[hidden]{display:none}.plain-time span:nth-child(1){color:var(--c0)}.plain-time span:nth-child(2){color:var(--c1)}.plain-time span:nth-child(4){color:var(--c2)}.plain-time span:nth-child(5){color:var(--c3)}.plain-time span:nth-child(3),.plain-time span:nth-child(6){margin:0 .08em;color:var(--muted)}.state-label{height:26px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);letter-spacing:1.4px}.state-label.quiet{font-family:var(--mono);font-size:12px;letter-spacing:4px;color:#737c6a}.state-label.counting{color:var(--c1);font-size:12px;letter-spacing:2px}.flash{position:absolute;inset:0;border-radius:20px;background:radial-gradient(ellipse,#c4d0ae18,transparent 66%);pointer-events:none;opacity:0}.a11y{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.stage{height:clamp(242px,32svh,360px)}
.minute{max-width:710px;width:calc(100% - 50px);margin:28px auto 0}.ruler{height:32px;display:grid;grid-template-columns:repeat(60,1fr);align-items:center;gap:4px}.tick{position:relative;background:transparent;padding:0;height:32px;border:0;border-radius:2px}.tick:before{content:"";position:absolute;left:50%;top:12px;width:2px;height:7px;transform:translateX(-50%);background:#30372b;transition:background .3s,height .3s,top .3s}.tick.major:before{height:12px;top:9px}.tick.solved:before{background:#7c8970}.tick.past:before{opacity:.55}.tick.current:before{height:22px;top:4px;background:var(--fg);box-shadow:0 0 10px #d5dbc333}.tick:hover:before{background:var(--c2);height:20px;top:5px}.ruler-labels{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--dim)}
.transport{display:flex;justify-content:center;align-items:center;gap:10px;height:38px;margin-top:18px}.transport[hidden]{display:flex;visibility:hidden}.transport button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:10px;border-radius:4px;letter-spacing:.5px}.transport .live-return{color:var(--c2)}.transport .divider{height:10px;width:1px;background:var(--line)}.transport .playback{font-family:var(--mono);font-size:10px;color:var(--dim);min-width:76px}.transport #play-pause{min-width:63px}
.settings-dialog{position:fixed;inset:80px 28px auto auto;margin:0;width:350px;max-width:calc(100vw - 32px);max-height:calc(100svh - 100px);overflow:auto;overscroll-behavior:contain;background:#181d17;border:1px solid #394232;border-radius:12px;color:var(--fg);padding:22px;box-shadow:0 16px 70px #0005;font-size:12px}.settings-dialog::backdrop{background:#0003}.settings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.settings-header h2{font-size:13px;font-weight:500;letter-spacing:1px;margin:0}.settings-close{display:grid;place-items:center;width:32px;height:32px;background:transparent;border:0;border-radius:5px;color:var(--muted)}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:16px 0;color:var(--muted)}.setting-row select{color:var(--fg);background:#111710;border:1px solid var(--line);border-radius:5px;padding:8px;max-width:180px}.setting-row input[type=range]{width:160px;accent-color:var(--c2)}.experimental-option{margin-top:22px;font-size:11px}.experimental-option small{font-size:9px;color:var(--dim);margin-left:5px}.experimental-option input{accent-color:var(--c2);width:16px;height:16px}.custom-time-label{display:block;margin:22px 0 9px;color:var(--muted)}.custom-time{display:flex;gap:8px}.custom-time input{background:#111710;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:8px;min-width:0;flex:1;font-family:var(--mono)}.settings-dialog .small-button{border:1px solid var(--line);background:transparent;border-radius:5px;padding:8px 10px;font-size:11px}.advanced{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.advanced summary{color:var(--muted);cursor:pointer;padding:4px 0}.advanced p{font-size:10px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere}.data-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.data-controls input[hidden]{display:none}.settings-links{display:flex;gap:18px;margin-top:22px}.settings-links a,.license-link{padding:0;border:0;background:none;color:var(--muted);font-size:10px;text-decoration:underline;text-underline-offset:3px}.settings-dialog.license-dialog{inset:0;margin:auto;width:760px;max-height:calc(100svh - 48px);padding:0}.license-dialog .settings-header{position:sticky;top:0;margin:0;padding:16px 22px;background:#181d17;border-bottom:1px solid var(--line);z-index:1}.license-content{padding:0 24px 24px;font-size:12px;line-height:1.8;overflow-wrap:anywhere}.license-content h1{display:none}.license-content h2{font-size:14px;margin-top:28px}.license-content a{color:var(--c2)}.license-content pre{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.7 var(--mono);color:var(--muted)}.license-content summary{cursor:pointer;padding:12px 0}.license-content details{border-bottom:1px solid var(--line)}.math-engine-frame{position:fixed;left:-100000px;top:0;width:300px;height:200px;visibility:hidden;pointer-events:none;border:0}
@media(max-width:760px){.shell{padding:22px}.brand{font-size:10px;letter-spacing:1.8px}.tools{gap:6px}main{padding:40px 0 48px}.minute{width:100%;margin-top:22px}.ruler{gap:2px}.source-time{font-size:22px}.settings-dialog{right:16px;top:76px;max-height:calc(100svh - 92px)}}
@media(max-width:480px){.shell{padding:18px 16px}.brand{font-size:9px;letter-spacing:1.4px;gap:8px}.tool{padding:10px;min-width:40px}.tools{gap:5px}.stage{height:226px}.transport{gap:2px}.transport button{padding:10px 7px}.transport .playback{min-width:60px;font-size:9px}.transport #play-pause{min-width:55px}.transport .live-return{white-space:nowrap}.setting-row select{max-width:165px}.settings-dialog{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*:before{scroll-behavior:auto!important}.math-scene .digit,.answer-digit,#equal-sign,#notation-root{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>FORMULA CLOCK</div>
  <div class="tools">
    <button class="tool icon-only" id="sound" aria-pressed="false" aria-label="時報のオン／オフ" title="時報のオン／オフ（M）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path id="sound-waves" d="m16 9 6 6m0-6-6 6"/></svg></button>
    <button class="tool icon-only" id="fullscreen" aria-label="全画面表示" title="全画面表示（F）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    <button class="tool icon-only" id="settings-open" aria-label="設定" aria-haspopup="dialog" aria-controls="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </div>
</header>
<main>
  <h1 class="a11y">Formula Clock</h1>
  <div class="clock-top">
    <div class="source-time" id="source-time" hidden aria-label="現在時刻"><span data-digit="0">0</span><span data-digit="1">0</span><span class="colon">:</span><span data-digit="2">0</span><span data-digit="3">0</span><span class="colon">:</span><span class="src-second" id="source-second">00</span></div>
  </div>
  <div class="stage-wrap">
    <div class="stage" id="stage" role="img" aria-label="計算時計">
      <div class="flash" id="flash"></div>
      <svg id="math-scene" class="math-scene" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g id="notation-root"></g>
        <g id="operator-root"></g>
        <g id="equal-sign"></g>
        <g class="digit" data-digit="0"></g><g class="digit" data-digit="1"></g><g class="digit" data-digit="2"></g><g class="digit" data-digit="3"></g>
        <g class="answer-digit" data-second="0"></g><g class="answer-digit" data-second="1"></g>
      </svg>
      <div id="plain-time" class="plain-time" aria-hidden="true"><span>0</span><span>0</span><span>:</span><span>0</span><span>0</span><span>:</span><span>0</span><span>0</span></div>
    </div>
  </div>
  <div class="minute">
    <div class="ruler" id="ruler" aria-label="秒を選んでプレビュー"></div>
    <div class="ruler-labels" aria-hidden="true"><span>00</span><span>15</span><span>30</span><span>45</span><span>59</span></div>
  </div>
  <div class="transport" id="transport" hidden>
    <button id="play-pause" title="再生／一時停止（Space）">一時停止</button><button id="slow" aria-pressed="false">0.5×</button><span class="divider"></span><span class="playback" id="playback">プレビュー</span><button class="live-return" id="go-live" title="現在時刻に戻る（L）">現在時刻へ</button>
  </div>
</main>
</div>
<dialog class="settings-dialog" id="settings" aria-labelledby="settings-title">
  <div class="settings-header"><h2 id="settings-title">設定</h2><button class="settings-close" id="settings-close" aria-label="設定を閉じる" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <label class="setting-row">字体<select id="font-choice" aria-label="数式の字体"><option value="stix2" selected>STIX Two</option><option value="euler">Euler</option></select></label>
  <label class="setting-row">除算<select id="division-choice" aria-label="除算の表記"><option value="fraction">分数</option><option value="inline">÷</option></select></label>
  <label class="setting-row">音量<input id="volume" type="range" min="0" max="100" value="25" aria-label="時報の音量"></label>
  <label class="custom-time-label" for="custom-time">時刻を指定</label>
  <div class="custom-time"><input type="time" id="custom-time" step="1" value="12:34:30"><button class="small-button" id="custom-go">表示</button></div>
  <label class="setting-row experimental-option"><span>記号も動かす <small>実験的</small></span><input id="symbol-motion" type="checkbox"></label>
  <label class="setting-row experimental-option"><span>分数・√・括弧も動かす <small>実験的2</small></span><input id="structure-motion" type="checkbox"></label>
  <label class="setting-row experimental-option"><span>＋と×を回す <small>実験的3</small></span><input id="symbol-morph" type="checkbox"></label>
  <details class="advanced" id="advanced-settings"><summary>詳細</summary>
    <div class="data-controls"><button class="small-button" id="import-data">式データを読み込む</button><button class="small-button" id="restore-data">元に戻す</button><input id="data-file" type="file" accept=".json,application/json" hidden></div>
    <p id="data-status" role="status">formula-clock/1 形式のJSON。</p>
    <p id="engine-status" role="status">MathJax · STIX Two を読み込み中</p>
    <p id="state-label" role="status"></p>
    <p>M 時報 / F 全画面 / L 現在時刻 / Space プレビューの再生と停止</p>
  </details>
  <div class="settings-links"><button class="license-link" id="licenses-open" aria-haspopup="dialog" aria-controls="licenses">ライセンス</button><a href="https://github.com/necocen/formula-clock" target="_blank" rel="noopener">GitHub ↗</a></div>
</dialog>
<dialog class="settings-dialog license-dialog" id="licenses" aria-labelledby="licenses-title">
  <div class="settings-header"><h2 id="licenses-title">ライセンス</h2><button class="settings-close" id="licenses-close" aria-label="ライセンスを閉じる" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <div class="license-content"><!-- licenses-content --></div>
</dialog>
<noscript><p style="padding:30px;text-align:center">この時計の表示にはJavaScriptが必要。</p></noscript>
