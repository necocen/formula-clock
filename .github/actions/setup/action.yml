name: Set up Formula Clock
description: Install the pinned pnpm, Node.js and Python dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          pyproject.toml
          pylock.toml
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - name: Install dependencies
      shell: bash
      # pnpm 12.4's Python lock includes OS, kernel and interpreter details.
      # Refresh it for this runner, while rejecting any JavaScript lock drift.
      run: |
        pnpm install --no-frozen-lockfile
        git diff --exit-code -- pnpm-lock.yaml
